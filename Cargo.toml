[package]
name = "tabularis-cassandra-plugin"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/TabularisDB/tabularis-cassandra-plugin"
description = "Tabularis driver plugin for Apache Cassandra and ScyllaDB over CQL."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
scylla = "1"
uuid = "1"
